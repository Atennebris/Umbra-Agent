scalar DateTime
scalar JSON

directive @auth(requires: Role = USER) on FIELD_DEFINITION

enum Role {
  ADMIN
  USER
  GUEST
}

type User {
  id: ID!
  name: String!
  email: String!
  role: Role!
  createdAt: DateTime!
}

interface Node {
  id: ID!
}

input CreateUserInput {
  name: String!
  email: String!
}

union SearchResult = User | Session

type Session {
  id: ID!
  userId: String!
  startedAt: DateTime!
}

type Query {
  user(id: ID!): User
  users: [User!]!
  session(id: ID!): Session
}

type Mutation {
  createUser(input: CreateUserInput!): User!
  deleteUser(id: ID!): Boolean!
}

type Subscription {
  userCreated: User!
}

fragment UserFields on User {
  id
  name
  email
}
